{% extends "layout.html" %}

{% block body %}
    <h1>Login</h1>

    <div class="auth-box">
        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter your username" required autofocus autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="off">
            </div>

            <button type="submit">Login</button>
        </form>
    </div>
{% endblock %}
