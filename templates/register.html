{% extends "layout.html" %}
{% block body %}

<h1>Register</h1>

<div class="auth-box">
    <form action="/register" method="post">

        <div class="form-group">
            <label for="first_name">First Name:</label>
            <input autocomplete="off" autofocus name="first_name" id="first_name" placeholder="First Name" type="text" required>
        </div>

        <div class="form-group">
            <label for="last_name">Last Name:</label>
            <input autocomplete="off" name="last_name" id="last_name" placeholder="Last Name" type="text" required>
        </div>

        <div class="form-group">
            <label for="username">Username:</label>
            <input autocomplete="off" name="username" id="username" placeholder="Choose a username" type="text" required>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input name="password" id="password" placeholder="Enter a strong password" type="password" required>
        </div>

        <div class="form-group">
            <label for="confirmation">Confirm Password:</label>
            <input name="confirmation" id="confirmation" placeholder="Re-enter your password" type="password" required>
        </div>

        <button type="submit">Register</button>
    </form>

    <p style="margin-top:15px;">Already have an account?
        <a href="/login" style="color:#58a6ff;">Log in here.</a>
    </p>
</div>

{% endblock %}
