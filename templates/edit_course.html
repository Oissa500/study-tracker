{% extends "layout.html" %}

{% block body %}
    <div class="container" style="margin-top: 50px; text-align:center;">
        <h2>Edit Course</h2>

        <form action="/edit_course/{{ course.id }}" method="post" style="display:inline-block; text-align:left;">
            <label>Course:</label><br>
            <input type="text" name="course" value="{{ course.course_name }}" autocomplete="off" required><br>

            <label>Semester:</label><br>
            <input type="text" name="semester" value="{{ course.semester }} " autocomplete="off"><br>

            <label>Note:</label><br>
            <input type="text" name="note" value="{{ course.note }}" autocomplete="off"><br><br>

            <button type="submit" style="background-color:green; color:white;">Update</button>
            <a href="/courses" style="margin-left:10px; color:orange;">Cancel</a>
        </form>
    </div>
{% endblock %}
