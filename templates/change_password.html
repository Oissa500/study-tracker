{% extends "layout.html" %}

{% block body %}
    <h1>Change Password</h1>

    <form action="/change_password" method="post" class="auth-box">
        <div class="form-group">
            <label>Old Password:</label>
            <input name="old_password" type="password" autocomplete="off" required>
        </div>

        <div class="form-group">
            <label>New Password:</label>
            <input name="new_password" type="password" autocomplete="off" required>
        </div>

        <div class="form-group">
            <label>Confirm New Password:</label>
            <input name="confirm_password" type="password" autocomplete="off" required>
        </div>

        <button type="submit">Update Password</button>
    </form>

    <p style="margin-top:15px;">
        <a href="/" style="color:#58a6ff;">← Back to Home</a>
    </p>
{% endblock %}
